name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Un fallo en Linux no debe ocultar el de Windows, y viceversa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # La DLL real forma parte del repo: si desaparece, el test de integración
      # se omitiría en silencio, así que se comprueba antes de ejecutar nada.
      - name: Comprobar la DLL de referencia
        shell: bash
        run: |
          dll=../vst/fxbLoader.dll
          if [ ! -f "$dll" ]; then
            echo "::error file=webapp/test/vfx-library.integration.test.ts::Falta $dll; sin ella el test de integración no comprueba nada."
            exit 1
          fi
          echo "DLL presente: $(wc -c < "$dll") bytes"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Ejecutar la suite
        run: npm test
